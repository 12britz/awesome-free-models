# Site settings
title: Awesome Free Models
email: 12britz@example.com
description: >-
  A curated list of free AI models, APIs, and tools you can use without paying a cent.
  Open-weight models you can self-host, free API tiers, and tools to run everything locally.
baseurl: ""
url: "https://12britz.github.io/awesome-free-models"
twitter_username: 12britz
github_username: 12britz

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
include:
  - _data

# Exclusions
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - .DS_Store

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-compose

# Defaults
defaults:
  all:
    layout: default
  posts:
    layout: post
    permalink: /posts/:title/

# Sass
sass:
  sass_dir: _assets/css
  style: compressed
  quiet_imports: true

# SEO
logo: /_assets/images/favicon.svg
social_links:
  github: 12britz/awesome-free-models
  twitter: 12britz

# Collections
collections:
  models:
    output: true
    permalink: /model/:name/
  categories:
    output: true
    permalink: /category/:name/